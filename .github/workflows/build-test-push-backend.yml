name: For call - build, test and push backend

on:
  workflow_call:
    inputs:
      project_id:
        description: "NAIS parameter"
        required: true
        type: string
      notest:
        description: "bypass test"
        required: true
        type: string
      skip_build_and_push:
        description: "Run tests only, skip building and pushing the docker image"
        required: false
        type: boolean
        default: false
    outputs:
      image:
        description: "Docker image"
        value: ${{ jobs.push.outputs.image }}

env:
  CI: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  golangci:
    env:
      CGO_ENABLED: 1
      CXX: clang++
      CC: clang
      CGO_CXXFLAGS: -Wno-everything
      CGO_LDFLAGS: -Wno-everything
      GOPROXY: https://proxy.golang.org,https://river:${{ secrets.RIVER_PRO_SECRET }}@riverqueue.com/goproxy,direct
      GONOSUMDB: riverqueue.com/riverpro
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        if: ${{ inputs.notest != 'true' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # ratchet:golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  staticchecks:
    env:
      CGO_ENABLED: 1
      CXX: clang++
      CC: clang
      CGO_CXXFLAGS: -Wno-everything
      CGO_LDFLAGS: -Wno-everything
      GOPROXY: https://proxy.golang.org,https://river:${{ secrets.RIVER_PRO_SECRET }}@riverqueue.com/goproxy,direct
      GONOSUMDB: riverqueue.com/riverpro
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: staticcheck
        if: ${{ inputs.notest != 'true' }}
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # ratchet:dominikh/staticcheck-action@v1
        with:
          version: "latest"
          install-go: false

  test-containers:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: NAIS login
        uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # ratchet:nais/login@v0
        id: login
        with:
          team: nada
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: projects/1007056531311/locations/global/workloadIdentityPools/ci-nada-prod/providers/ci-nada-prod
          service_account: ci-nada-images@nada-prod-6977.iam.gserviceaccount.com

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4.6.0
        name: Login to Google Artifact Registry
        with:
          registry: europe-north1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Check if images exist
        id: check-images
        run: |
          set +e
          make check-images
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Build and push all images
        if: ${{ steps.check-images.outputs.exit_code != 0 }}
        run: make build-push-all

  tests:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest-8-cores
    needs:
      - test-containers
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: projects/1007056531311/locations/global/workloadIdentityPools/ci-nada-prod/providers/ci-nada-prod
          service_account: ci-nada-images@nada-prod-6977.iam.gserviceaccount.com
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4.6.0
        name: Login to Google Artifact Registry
        with:
          registry: europe-north1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - id: check-images
        if: ${{ inputs.notest != 'true' }}
        run: make pull-deps pull-metabase
      - id: setup-go
        if: ${{ inputs.notest != 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - id: store-metabase-test-credentials
        if: ${{ inputs.notest != 'true' }}
        run: |
          cat << 'EOF' > tests-metabase-all-users-sa-creds.json
          ${{ secrets.METABASE_ALL_USERS_SA_CREDS_JSON }}
          EOF
      - id: run-tests
        if: ${{ inputs.notest != 'true' }}
        run: make test
        env:
          RIVER_PRO_SECRET: ${{ secrets.RIVER_PRO_SECRET }}

  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_build_and_push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make release
        env:
          RIVER_PRO_SECRET: ${{ secrets.RIVER_PRO_SECRET }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
        with:
          name: nada-backend
          path: nada-backend

  push:
    name: Build and push docker image
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    needs: [build, golangci, tests, staticchecks]
    if: ${{ github.actor != 'dependabot[bot]' && !inputs.skip_build_and_push }}
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - name: Download nada-backend binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8
        with:
          name: nada-backend
      - name: Push docker image to GAR
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # ratchet:nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: nada
          image_suffix: backend
          dockerfile: ./resources/images/nada-backend/Dockerfile
